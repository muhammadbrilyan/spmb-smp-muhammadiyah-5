# ============================================================
# Pengaturan PHP — Fase 12 C4 (shared hosting cPanel/Domainesia).
# Berlaku untuk PHP-FPM/CGI (lazim di cPanel); mod_php mengabaikan
# file ini (pengaturan mod_php ada di .htaccess <IfModule mod_php.c>).
# Alternatif di cPanel: MultiPHP INI Editor (menu "MultiPHP INI Editor").
# Batas upload disamakan dengan ukuran maks dokumen aplikasi (2 MB + margin).
# ============================================================
display_errors=Off
log_errors=On
upload_max_filesize=3M
post_max_size=8M
